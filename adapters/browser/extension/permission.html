<!doctype html>
<meta charset="utf-8" />
<title>ClueBro microphone access</title>
<body style="font: 15px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem">
  <h1 style="font-size: 1.4rem">Microphone access</h1>
  <p id="state">
    ClueBro transcribes your side of the call from the microphone. Chrome can only ask for that
    here: the recorder runs in a hidden page that cannot show a permission prompt.
  </p>
  <button id="allow" type="button">Allow microphone</button>
  <script src="permission.js"></script>
</body>
